buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'signing'

version = mod_version
group = mod_group_id
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version

    accessTransformer = file('src/main/resources/META-INF/attributeslib_at.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker',
                 '--mixin', "${mod_id}.mixins.json".toString()
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker',
                 '--mixin', "${mod_id}.mixins.json".toString()
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.3:processor'
    compile 'org.spongepowered:mixin:0.8.3'
    testCompile 'junit:junit:4.12'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand([
                'mod_id'         : mod_id,
                'mod_name'       : mod_name,
                'mod_version'    : mod_version,
                'mod_authors'    : mod_authors,
                'mod_description': mod_description,
                'minecraft_version': minecraft_version,
                'version'        : project.version
        ])
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'TweakClass'              : 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder'              : '0',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod'          : 'true',
                'FMLAT'                   : 'attributeslib_at.cfg'
        ])
    }
}

jar.finalizedBy('reobfJar')

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    classifier = 'javadoc'
    from javadoc
}

javadoc {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

def publishedArtifactId = project.hasProperty('maven_artifact_id') ? project.property('maven_artifact_id') : mod_id
def centralStagingDir = file("$buildDir/central-staging")
def centralBundleFileName = "${publishedArtifactId}-${mod_version}-central-bundle.zip"

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId publishedArtifactId
            version project.version
            artifact jar
            artifact sourcesJar
            artifact javadocJar

            pom.withXml {
                def root = asNode()
                root.appendNode('name', mod_name)
                root.appendNode('description', mod_description)
                root.appendNode('url', 'https://github.com/hhoao/AttributesLib')

                def licensesNode = root.appendNode('licenses')
                def licenseNode = licensesNode.appendNode('license')
                licenseNode.appendNode('name', 'Mozilla Public License 2.0')
                licenseNode.appendNode('url', 'https://www.mozilla.org/en-US/MPL/2.0/')
                licenseNode.appendNode('distribution', 'repo')

                def developersNode = root.appendNode('developers')
                def developerNode = developersNode.appendNode('developer')
                developerNode.appendNode('id', 'hhoao')
                developerNode.appendNode('name', 'hhoao')
                developerNode.appendNode('url', 'https://github.com/hhoao')

                def scmNode = root.appendNode('scm')
                scmNode.appendNode('connection', 'scm:git:https://github.com/hhoao/AttributesLib.git')
                scmNode.appendNode('developerConnection', 'scm:git:ssh://git@github.com/hhoao/AttributesLib.git')
                scmNode.appendNode('url', 'https://github.com/hhoao/AttributesLib')
            }
        }
    }
    repositories {
        maven {
            name 'centralStaging'
            url centralStagingDir
        }
        maven {
            name 'localRepo'
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

task cleanCentralStaging(type: Delete) {
    delete centralStagingDir
}

task centralBundle(type: Zip) {
    group = 'publishing'
    description = 'Builds a Maven Central Portal upload bundle.'
    dependsOn 'publishMavenJavaPublicationToCentralStagingRepository'
    archiveName = centralBundleFileName
    destinationDir = file("$buildDir/distributions")
    from(centralStagingDir) {
        exclude '**/maven-metadata.xml*'
    }
}

afterEvaluate {
    tasks.getByName('publishMavenJavaPublicationToCentralStagingRepository').dependsOn cleanCentralStaging
}

signing {
    useGpgCmd()
    required {
        project.hasProperty('release') && gradle.taskGraph.allTasks.any { task ->
            task.name == 'centralBundle' || task.name.startsWith('publish') || task.name.startsWith('sign')
        }
    }
    sign publishing.publications.mavenJava
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ------------------------------------------------------------------
// dev-run 修复：FG3 + 1.12.2 legacydev 下，FML 把 @Mod 类所在目录
// 注册为 FMLFileResourcePack 源，但那目录不包含 assets/mcmod.info/pack.mcmeta
// （它们只在 build/resources/main）。表现：lang 走 raw key、贴图报
// "Failed to load texture"。把 resources 镜像一份到 classes 目录，
// 让 FML 从同一个目录既识别到 mod 又能读到资源。仅影响 dev run，不动
// processResources 原输出（保持 FG3 的 AT hash 稳定，jar 打包也不受影响）。
// ------------------------------------------------------------------
tasks.register('mirrorResourcesForDevRun', Copy) {
    dependsOn tasks.named('processResources')
    from sourceSets.main.output.resourcesDir
    into file("${buildDir}/classes/java/main")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn('mirrorResourcesForDevRun')
}
