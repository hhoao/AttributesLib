plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            java_version           : java_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    includeEmptyDirs = false

    var replaceProperties = [
            mod_id      : mod_id,
            mod_name    : mod_name,
            mod_version : mod_version,
            java_version: java_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['pack.mcmeta', "${mod_id}.mixins.json".toString()]) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
}

tasks.named('javadoc', Javadoc).configure {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

def centralStagingDir = layout.buildDirectory.dir('central-staging')
def publishedArtifactId = providers.gradleProperty('maven_artifact_id').orElse(mod_id).get()
def centralBundleFileName = "${publishedArtifactId}-${mod_version}-central-bundle.zip"

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = publishedArtifactId
            version = project.version
            from components.java

            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/hhoao/AttributesLib'

                licenses {
                    license {
                        name = 'Mozilla Public License 2.0'
                        url = 'https://www.mozilla.org/en-US/MPL/2.0/'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'hhoao'
                        name = 'hhoao'
                        url = 'https://github.com/hhoao'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/hhoao/AttributesLib.git'
                    developerConnection = 'scm:git:ssh://git@github.com/hhoao/AttributesLib.git'
                    url = 'https://github.com/hhoao/AttributesLib'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralStaging'
            url = centralStagingDir
        }
        maven {
            name = 'localRepo'
            url = layout.projectDirectory.dir('repo')
        }
    }
}

tasks.register('cleanCentralStaging', Delete) {
    delete centralStagingDir
}

tasks.named('publishMavenJavaPublicationToCentralStagingRepository').configure {
    dependsOn tasks.named('cleanCentralStaging')
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Builds a Maven Central Portal upload bundle.'
    dependsOn tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
    archiveFileName = centralBundleFileName
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(centralStagingDir) {
        exclude '**/maven-metadata.xml*'
    }
}

def signingKey = providers.gradleProperty('signingKey').orElse(providers.environmentVariable('GPG_PRIVATE_KEY'))
def signingPassword = providers.gradleProperty('signingPassword').orElse(providers.environmentVariable('GPG_PASSPHRASE'))

signing {
    useInMemoryPgpKeys(signingKey.orNull, signingPassword.orNull)
    required {
        def releaseProperty = providers.gradleProperty('release').map { it.toBoolean() }.orElse(false).get()
        releaseProperty && gradle.taskGraph.allTasks.any { task ->
            task.name == 'centralBundle' || task.name.startsWith('publish') || task.name.startsWith('sign')
        }
    }
    sign publishing.publications.mavenJava
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
