name: AttributesLib Release Forge 1.16.4

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish, for example 1.16.4-1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: attributeslib-release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-to-maven-central:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_VERSION}" == *"-SNAPSHOT" ]]; then
            echo "Release version must not be a SNAPSHOT: ${RELEASE_VERSION}"
            exit 1
          fi

          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release version contains unsupported characters: ${RELEASE_VERSION}"
            exit 1
          fi

          if ! git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Required git tag v${RELEASE_VERSION} was not found"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Maven Central bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace -Pmod_version="${RELEASE_VERSION}" -Prelease=true clean centralBundle
          MAVEN_ARTIFACT_ID="$(grep -E '^maven_artifact_id=' gradle.properties | cut -d= -f2-)"
          unzip -l "build/distributions/${MAVEN_ARTIFACT_ID}-${RELEASE_VERSION}-central-bundle.zip" | grep -q '\.asc$'

      - name: Upload bundle to Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          MAVEN_ARTIFACT_ID="$(grep -E '^maven_artifact_id=' gradle.properties | cut -d= -f2-)"
          BUNDLE="build/distributions/${MAVEN_ARTIFACT_ID}-${RELEASE_VERSION}-central-bundle.zip"
          if [[ ! -f "${BUNDLE}" ]]; then
            echo "Bundle not found: ${BUNDLE}"
            exit 1
          fi

          AUTH_TOKEN="$(printf '%s:%s' "${CENTRAL_PORTAL_USERNAME}" "${CENTRAL_PORTAL_PASSWORD}" | base64 | tr -d '\n')"
          DEPLOYMENT_ID="$(
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer ${AUTH_TOKEN}" \
              --form "bundle=@${BUNDLE}" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=io.github.hhoao-${MAVEN_ARTIFACT_ID}-${RELEASE_VERSION}&publishingType=AUTOMATIC"
          )"

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_ENV}"
          echo "Uploaded deployment ${DEPLOYMENT_ID}"

      - name: Wait for Central publication
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          set -euo pipefail

          AUTH_TOKEN="$(printf '%s:%s' "${CENTRAL_PORTAL_USERNAME}" "${CENTRAL_PORTAL_PASSWORD}" | base64 | tr -d '\n')"

          for attempt in {1..60}; do
            RESPONSE="$(
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer ${AUTH_TOKEN}" \
                "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}"
            )"

            STATE="$(jq -r '.deploymentState // empty' <<< "${RESPONSE}")"
            echo "Central deployment state: ${STATE:-unknown} (attempt ${attempt}/60)"

            case "${STATE}" in
              PUBLISHED)
                exit 0
                ;;
              FAILED)
                echo "${RESPONSE}" | jq .
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "Timed out waiting for Central publication."
          exit 1
